name: Lite Actions Blue source reconciliation
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: write
concurrency:
  group: lite-vllm-blue-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'cann-framework/vllm-ascend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cann-framework/vllm-ascend
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Invalidate stale Blue merge tests and dispatch exact new Head/Base
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/lite_actions/native_reconcile.py
